name: 免费服务器性能测试

on:
  workflow_dispatch: # 允许你随时手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest # 告诉微软：给我一台最新的 Ubuntu 服务器

    steps:
    - name: 1. 把代码拷贝到云端服务器
      uses: actions/checkout@v3

    - name: 2. 配置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 安装依赖库
      run: pip install psutil

    - name: 4. 运行体检脚本
      run: python server_info.py